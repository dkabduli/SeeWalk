<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SeeWalk Signal Path</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
*{box-sizing:border-box} body{margin:0}
:root{
  --bg:#EEF1EC; --surface:#F8FAF7; --ink:#16201C; --muted:#5B6863; --line:#CBD3CE;
  --node:#2B3833; --data:#2A63D4; --voice:#C63D24;
  --sans:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F1513; --surface:#161E1B; --ink:#E4EBE7; --muted:#93A19B; --line:#2A3531;
    --node:#C3CFC9; --data:#77A0FF; --voice:#FF7C5E;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1513; --surface:#161E1B; --ink:#E4EBE7; --muted:#93A19B; --line:#2A3531;
  --node:#C3CFC9; --data:#77A0FF; --voice:#FF7C5E;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;padding:0 20px}
.app{max-width:1300px;margin:0 auto;padding-block:20px 24px;display:flex;flex-direction:column;gap:14px}
h1{margin:0;font-size:clamp(26px,3.6vw,36px);font-weight:800;letter-spacing:-.02em;line-height:1.1}
.sub{margin:4px 0 0;color:var(--muted);max-width:60ch}
.stage{position:relative;height:min(76vh,700px);min-height:420px;border:1px solid var(--line);border-radius:6px;background:var(--surface);overflow:hidden;touch-action:none}
.stage canvas{display:block}
.labels{position:absolute;inset:0;pointer-events:none}
.nl{text-align:center;white-space:nowrap;line-height:1.2}
.nl .k{display:block;font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.08em}
.nl b{display:block;font-size:15px;font-weight:800}
.nl span{display:block;font-size:12px;color:var(--muted)}
.el{font-family:var(--mono);font-size:11.5px;font-weight:500;padding:2px 7px;border-radius:3px;background:var(--surface);border:1px solid currentColor;white-space:nowrap}
.el.data{color:var(--data)} .el.voice{color:var(--voice)}
.hint{position:absolute;right:12px;bottom:10px;font-family:var(--mono);font-size:11px;color:var(--muted);pointer-events:none}
.fallback{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--muted)}
@media (max-width:700px){ .stage{height:64vh;min-height:360px} .nl span{display:none} }
@media (max-width:480px){ body{padding:0 16px} }
</style>

</head>
<body>
<div class="app">
  <header>
    <h1>SeeWalk signal path</h1>
    <p class="sub">A camera frame goes to Gemini, Gemini says what's there, SeeWalk picks what matters, and ElevenLabs says it in the walker's ear.</p>
  </header>
  <div class="stage" id="stage"><div class="hint">drag to turn · scroll to zoom</div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS2DRenderer.js"></script>
<script>
(function(){
const stage=document.getElementById('stage');
if(!(window.THREE&&THREE.OrbitControls&&THREE.CSS2DRenderer)){
  stage.insertAdjacentHTML('beforeend','<div class="fallback">The 3D view could not load.<br>Camera → Gemini → SeeWalk → ElevenLabs → Headphones</div>');
  return;
}
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

const NODES=[
  {name:'Camera',sub:'phone takes a photo',tone:'node',shape:'cam',pos:[-8,0,0]},
  {name:'Gemini',sub:'sees the hazards',tone:'data',shape:'ico',pos:[-4,1.4,-1]},
  {name:'SeeWalk',sub:'picks what matters',tone:'node',shape:'oct',pos:[0,0,0]},
  {name:'ElevenLabs',sub:'turns it into a voice',tone:'voice',shape:'sphere',pos:[4,1.4,-1]},
  {name:'Headphones',sub:'walker hears it',tone:'voice',shape:'phones',pos:[8,0,0]}
];
const EDGES=[
  {label:'photo',tone:'data'},
  {label:'hazards',tone:'data'},
  {label:'what to say',tone:'voice'},
  {label:'voice',tone:'voice'}
];

const tok=()=>{const s=getComputedStyle(document.documentElement);const g=k=>s.getPropertyValue(k).trim();
  return {node:g('--node'),data:g('--data'),voice:g('--voice'),line:g('--line')};};
let T=tok(); const C=k=>new THREE.Color(T[k]);

const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.setClearColor(0,0);
stage.prepend(renderer.domElement);
const labelR=new THREE.CSS2DRenderer(); labelR.domElement.className='labels'; stage.appendChild(labelR.domElement);

const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(36,1,0.1,200);
cam.position.set(0,7,20);
const controls=new THREE.OrbitControls(cam,renderer.domElement);
controls.target.set(0,0.4,-0.3); controls.enableDamping=true; controls.enablePan=false;
controls.minDistance=9; controls.maxDistance=40;
controls.update();
scene.add(new THREE.HemisphereLight(0xffffff,0x5a6660,0.9));
const dl=new THREE.DirectionalLight(0xffffff,0.7); dl.position.set(4,12,10); scene.add(dl);

const label=(html,cls)=>{const d=document.createElement('div');d.className=cls;d.innerHTML=html;return new THREE.CSS2DObject(d);};

/* nodes */
const mats=[];
NODES.forEach((n,i)=>{
  const g=new THREE.Group(); g.position.set(...n.pos); scene.add(g);
  const mat=new THREE.MeshStandardMaterial({color:C(n.tone),roughness:0.5,flatShading:n.shape==='ico'});
  mats.push({mat,tone:n.tone});
  const add=(geo,f)=>{const m=new THREE.Mesh(geo,mat); if(f) f(m); g.add(m);};
  if(n.shape==='cam'){ add(new THREE.BoxGeometry(1.3,0.9,0.5)); add(new THREE.CylinderGeometry(0.3,0.3,0.4,32),m=>{m.rotation.x=Math.PI/2;m.position.z=0.35;}); }
  if(n.shape==='ico') add(new THREE.IcosahedronGeometry(0.9,0));
  if(n.shape==='oct') add(new THREE.OctahedronGeometry(0.8));
  if(n.shape==='sphere') add(new THREE.SphereGeometry(0.8,32,20));
  if(n.shape==='phones'){ add(new THREE.TorusGeometry(0.75,0.13,14,48,Math.PI)); [-0.75,0.75].forEach(x=>add(new THREE.CylinderGeometry(0.26,0.26,0.24,24),m=>{m.position.x=x;m.rotation.z=Math.PI/2;})); }
  n.g=g;
  const l=label('<span class="k">'+(i+1)+'</span><b>'+n.name+'</b><span>'+n.sub+'</span>','nl');
  l.position.set(0,-1.35,0); g.add(l);
});

/* edges + moving dots */
const edges=EDGES.map((e,i)=>{
  const a=new THREE.Vector3(...NODES[i].pos), b=new THREE.Vector3(...NODES[i+1].pos);
  const mid=a.clone().add(b).multiplyScalar(0.5); mid.y+=1.3;
  const curve=new THREE.QuadraticBezierCurve3(a,mid,b);
  const mat=new THREE.MeshBasicMaterial({color:C(e.tone),transparent:true,opacity:0.35});
  scene.add(new THREE.Mesh(new THREE.TubeGeometry(curve,48,0.035,8,false),mat));
  const l=label(e.label,'el '+e.tone); l.position.copy(curve.getPoint(0.5)).add(new THREE.Vector3(0,0.45,0)); scene.add(l);
  const dotMat=new THREE.MeshBasicMaterial({color:C(e.tone)});
  const dots=[0,1,2].map(()=>{const d=new THREE.Mesh(new THREE.SphereGeometry(0.13,16,12),dotMat);scene.add(d);return d;});
  return {curve,mat,dotMat,dots,tone:e.tone};
});

function applyTheme(){
  T=tok();
  mats.forEach(m=>m.mat.color=C(m.tone));
  edges.forEach(e=>{e.mat.color=C(e.tone);e.dotMat.color=C(e.tone);});
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);
new MutationObserver(applyTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

function resize(){
  const w=stage.clientWidth,h=stage.clientHeight;
  renderer.setSize(w,h); labelR.setSize(w,h);
  cam.aspect=w/h; cam.fov=w/h<1?68:36; cam.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage); resize();

/* one "pulse" travels the whole chain; each edge gets 3 trailing dots */
const LOOP=5200;
function frame(now){
  const p=reduce?0.5:(now%LOOP)/LOOP;
  edges.forEach((e,i)=>{
    e.dots.forEach((d,j)=>{
      const u=reduce?(j+1)/4:((p*EDGES.length - i) - j*0.08);
      d.visible=u>=0&&u<=1;
      if(d.visible) d.position.copy(e.curve.getPoint(u));
    });
  });
  if(!reduce){ NODES[1].g.rotation.y+=0.004; NODES[3].g.rotation.y-=0.003; }
  controls.update();
  renderer.render(scene,cam); labelR.render(scene,cam);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
