<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1222" viewBox="0 0 1360 1222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><title>How VisionCompanion works: phone, server, Gemini, ElevenLabs, Tiger Data</title><rect width="1360" height="1222" rx="16" fill="#0f1113"/><line x1="110" y1="158" x2="110" y2="1162" stroke="#2e3238" stroke-width="1.5" stroke-dasharray="3 6"/><line x1="340" y1="158" x2="340" y2="1162" stroke="#2e3238" stroke-width="1.5" stroke-dasharray="3 6"/><line x1="570" y1="158" x2="570" y2="1162" stroke="#2e3238" stroke-width="1.5" stroke-dasharray="3 6"/><line x1="800" y1="158" x2="800" y2="1162" stroke="#2e3238" stroke-width="1.5" stroke-dasharray="3 6"/><line x1="1030" y1="158" x2="1030" y2="1162" stroke="#2e3238" stroke-width="1.5" stroke-dasharray="3 6"/><line x1="1250" y1="158" x2="1250" y2="1162" stroke="#2e3238" stroke-width="1.5" stroke-dasharray="3 6"/><rect x="24" y="184" width="1312" height="34" rx="8" fill="#1a1d21" stroke="#2e3238"/><circle cx="48" cy="201" r="11" fill="#e0362c"/><text x="48" y="205.5" font-size="13" fill="#0f1113" text-anchor="middle" font-weight="700">1</text><text x="68" y="206" font-size="15" fill="#f4f2ed" font-weight="600">Street alerts, automatic: a new snapshot every 0.8 s, up to 2 at Gemini at once</text><line x1="346" y1="250" x2="561" y2="250" stroke="#f4f2ed" stroke-width="1.8"/><path d="M569,250 L557,244 L557,256 Z" fill="#f4f2ed"/><rect x="357.9" y="226" width="194.2" height="18" fill="#0f1113"/><text x="455.0" y="240" font-size="13" fill="#f4f2ed" text-anchor="middle">POST /analyze · 768 px JPEG</text><line x1="576" y1="290" x2="791" y2="290" stroke="#f4f2ed" stroke-width="1.8"/><path d="M799,290 L787,284 L787,296 Z" fill="#f4f2ed"/><rect x="584.6" y="266" width="200.79999999999998" height="18" fill="#0f1113"/><text x="685.0" y="280" font-size="13" fill="#f4f2ed" text-anchor="middle">image + prompt + JSON schema</text><line x1="794" y1="330" x2="579" y2="330" stroke="#7d8ea3" stroke-width="1.8" stroke-dasharray="6 5"/><path d="M571,330 L583,324 L583,336 Z" fill="#7d8ea3"/><rect x="505.4" y="306" width="359.2" height="18" fill="#0f1113"/><text x="685.0" y="320" font-size="13" fill="#f4f2ed" text-anchor="middle">hazards: type, left/ahead/right, distance · ~1.6–2 s</text><line x1="564" y1="370" x2="349" y2="370" stroke="#7d8ea3" stroke-width="1.8" stroke-dasharray="6 5"/><path d="M341,370 L353,364 L353,376 Z" fill="#7d8ea3"/><rect x="394.2" y="346" width="121.6" height="18" fill="#0f1113"/><text x="455.0" y="360" font-size="13" fill="#f4f2ed" text-anchor="middle">SceneResult JSON</text><rect x="90.0" y="390" width="500" height="30" rx="6" fill="#1a1d21" stroke="#7d8ea3"/><text x="340" y="410" font-size="12" fill="#f4f2ed" text-anchor="middle">Picks one: street hazards only · confidence ≥ 0.6 · first sighting, again under 2 m</text><line x1="334" y1="452" x2="119" y2="452" stroke="#f3b21b" stroke-width="3"/><path d="M111,452 L123,446 L123,458 Z" fill="#f3b21b"/><rect x="75.1" y="428" width="299.8" height="18" fill="#0f1113"/><text x="225.0" y="442" font-size="13" fill="#f4f2ed" text-anchor="middle" font-weight="600">tone in L/R ear + “Stop sign on your right”</text><rect x="24" y="488" width="1312" height="34" rx="8" fill="#1a1d21" stroke="#2e3238"/><circle cx="48" cy="505" r="11" fill="#e0362c"/><text x="48" y="509.5" font-size="13" fill="#0f1113" text-anchor="middle" font-weight="700">2</text><text x="68" y="510" font-size="15" fill="#f4f2ed" font-weight="600">Ask a question: “VisionCompanion, read this.” (also: what&#x27;s ahead, what am I holding, what&#x27;s blocking my path)</text><line x1="116" y1="554" x2="331" y2="554" stroke="#f4f2ed" stroke-width="1.8"/><path d="M339,554 L327,548 L327,560 Z" fill="#f4f2ed"/><rect x="197.2" y="530" width="55.599999999999994" height="18" fill="#0f1113"/><text x="225.0" y="544" font-size="13" fill="#f4f2ed" text-anchor="middle">speech</text><line x1="346" y1="594" x2="561" 