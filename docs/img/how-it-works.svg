path d="M111,834 L123,828 L123,840 Z" fill="#f3b21b"/><rect x="124.60000000000001" y="810" width="200.79999999999998" height="18" fill="#0f1113"/><text x="225.0" y="824" font-size="13" fill="#f4f2ed" text-anchor="middle" font-weight="600">the answer, in River&#x27;s voice</text><rect x="24" y="870" width="1312" height="34" rx="8" fill="#1a1d21" stroke="#2e3238"/><circle cx="48" cy="887" r="11" fill="#e0362c"/><text x="48" y="891.5" font-size="13" fill="#0f1113" text-anchor="middle" font-weight="700">3</text><text x="68" y="892" font-size="15" fill="#f4f2ed" font-weight="600">Once, ahead of time</text><line x1="1024" y1="936" x2="349" y2="936" stroke="#7d8ea3" stroke-width="1.8" stroke-dasharray="6 5"/><path d="M341,936 L353,930 L353,942 Z" fill="#7d8ea3"/><rect x="310.70000000000005" y="912" width="748.5999999999999" height="18" fill="#0f1113"/><text x="685.0" y="926" font-size="13" fill="#f4f2ed" text-anchor="middle">Multilingual v2 → 148 River clips + 110 each for Alice, Charlie, Moyo (EN + FR), bundled: alerts play instantly</text><rect x="24" y="972" width="1312" height="34" rx="8" fill="#1a1d21" stroke="#2e3238"/><circle cx="48" cy="989" r="11" fill="#e0362c"/><text x="48" y="993.5" font-size="13" fill="#0f1113" text-anchor="middle" font-weight="700">4</text><text x="68" y="994" font-size="15" fill="#f4f2ed" font-weight="600">Hazard map: confident sidewalk hazards, saved with GPS and time (no photos)</text><line x1="346" y1="1038" x2="561" y2="1038" stroke="#f4f2ed" stroke-width="1.8"/><path d="M569,1038 L557,1032 L557,1044 Z" fill="#f4f2ed"/><rect x="308.4" y="1014" width="293.2" height="18" fill="#0f1113"/><text x="455.0" y="1028" font-size="13" fill="#f4f2ed" text-anchor="middle">POST /hazards · pothole, curb… ≥ 0.7 + GPS</text><line x1="576" y1="1078" x2="1241" y2="1078" stroke="#f4f2ed" stroke-width="1.8"/><path d="M1249,1078 L1237,1072 L1237,1084 Z" fill="#f4f2ed"/><rect x="779.9" y="1054" width="260.2" height="18" fill="#0f1113"/><text x="910.0" y="1068" font-size="13" fill="#f4f2ed" text-anchor="middle">hypertable row (deduped: 15 m, 5 min)</text><line x1="1244" y1="1118" x2="349" y2="1118" stroke="#7d8ea3" stroke-width="1.8" stroke-dasharray="6 5"/><path d="M341,1118 L353,1112 L353,1124 Z" fill="#7d8ea3"/><rect x="681.4" y="1094" width="227.2" height="18" fill="#0f1113"/><text x="795.0" y="1108" font-size="13" fill="#f4f2ed" text-anchor="middle">?map: pins + most-reported spots</text><rect x="14" y="92" width="192" height="66" rx="12" fill="#1a1d21" stroke="#f4f2ed" stroke-width="2"/><text x="110" y="121" font-size="17" fill="#f4f2ed" text-anchor="middle" font-weight="700">Walker</text><text x="110" y="142" font-size="13" fill="#9aa3ad" text-anchor="middle" font-weight="400">open-ear headphones</text><rect x="244" y="92" width="192" height="66" rx="12" fill="#1a1d21" stroke="#f4f2ed" stroke-width="2"/><text x="340" y="121" font-size="17" fill="#f4f2ed" text-anchor="middle" font-weight="700">iPhone (Safari)</text><text x="340" y="142" font-size="13" fill="#9aa3ad" text-anchor="middle" font-weight="400">chest camera + mic</text><rect x="474" y="92" width="192" height="66" rx="12" fill="#1a1d21" stroke="#f4f2ed" stroke-width="2"/><text x="570" y="121" font-size="17" fill="#f4f2ed" text-anchor="middle" font-weight="700">Our server</text><text x="570" y="142" font-size="13" fill="#9aa3ad" text-anchor="middle" font-weight="400">FastAPI on the laptop</text><rect x="704" y="92" width="192" height="66" rx="12" fill="#1a1d21" stroke="#8ab4f8" stroke-width="2"/><text x="800" y="121" font-size="17" fill="#8ab4f8" text-anchor="middle" font-weight="700">Gemini</text><text x="800" y="142" font-size="13" fill="#9aa3ad" text-anchor="middle" font-weight="400">3.5 Flash-Lite</text><rect x="934" y="92" width="192" height="66" rx="12" fill="#1a1d21" stroke="#f3b21b" stroke-width="2"/><text x="1030" y="121" font-size="17" fill="#f3b21b" text-anchor="middle" font-weight="700">ElevenLabs</text><text x="1030" y="142" font-size="13" fill="#9aa3ad" text-anchor="middle" font-weight="400">River + 3 more voices</text><rect x="1154" y="92" width="192" height="66" rx="12" fill="#1a1d21" stroke="#6fcf97" stroke-width="2"/><text x="1250" y="121" font-size="17" fill="#6fcf97" text-anchor="middle" font-weight="700">Tiger Data</text><text x="1250" y="142" font-size="13" fill="#9aa3ad" text-anchor="middle" font-weight="400">PostgreSQL hypertable</text><text x="24" y="44" font-size="28" fill="#f4f2ed" text-anchor="start" font-weight="700">How VisionCompanion works</text><text x="24" y="72" font-size="14.5" fill="#9aa3ad" text-anchor="start" font-weight="400">The phone sees, Gemini understands, ElevenLabs speaks. Gemini and ElevenLabs times measured from our laptop, Sept 2026.</text><line x1="24" y1="1191" x2="58" y2="1191" stroke="#f4f2ed" stroke-width="1.8"/><text x="66" y="1196" font-size="13" fill="#9aa3ad" text-anchor="start" font-weight="400">request</text><line x1="134.2" y1="1191" x2="168.2" y2="1191" stroke="#7d8ea3" stroke-width="1.8" stroke-dasharray="6 5"/><text x="176.2" y="1196" font-size="13" fill="#9aa3ad" text-anchor="start" font-weight="400">response</text><line x1="251.0" y1="1191" x2="285.0" y2="1191" stroke="#f3b21b" stroke-width="3"/><text x="293.0" y="1196" font-size="13" fill="#9aa3ad" text-anchor="start" font-weight="400">what the walker hears</text><text x="1336" y="1196" font-size="13" fill="#9aa3ad" text-anchor="end" font-weight="400">Hazard in view → heard: ~2 s (estimate)</text></svg>
